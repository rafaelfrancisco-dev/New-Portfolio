name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only; no job here needs to write to the repo, comment on
# PRs, or publish anything, so the GITHUB_TOKEN carries no extra authority.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install codegen tools
        run: make tools

      - name: Regenerate code and CSS
        run: make generate css

      - name: Fail if generated files drifted from sources
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  deploy:
    name: Deploy to smalljammy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64]
    concurrency:
      group: new-portfolio-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build production binary
        id: build
        env:
          STAGING_DIR: /srv/new-portfolio/staging/${{ github.sha }}
        run: |
          install -d -m 0750 "$STAGING_DIR"
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$STAGING_DIR/server" ./cmd/server
          echo "digest=$(sha256sum "$STAGING_DIR/server" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy production service
        run: sudo /usr/local/sbin/deploy-new-portfolio "${{ github.sha }}" "${{ steps.build.outputs.digest }}"

      - name: Verify health endpoint
        run: curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused -H "Host: imaginarymakings.dev" http://127.0.0.1:8081/healthz
